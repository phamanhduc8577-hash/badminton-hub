services:
  postgres:
    image: postgres:16-alpine
    container_name: smashflow-postgres
    restart: always
    environment:
      POSTGRES_DB: smashflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
