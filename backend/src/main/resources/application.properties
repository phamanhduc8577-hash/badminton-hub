spring.application.name=smashflow-backend
server.port=8081

# Database Configuration (Docker Postgres on 5433 with environment variable fallback)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/smashflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# HikariCP Connection Pool (Optimized for Supabase / Free Tier 512MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000

# JWT Configuration (Supports ENV override for production deployment)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (Supports custom domains via ENV)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,http://localhost:3008,http://localhost:5173}

# VietQR Banking Configuration (MB Bank)
vietqr.bank-id=${VIETQR_BANK_ID:MB}
vietqr.account-no=${VIETQR_ACCOUNT_NO:0325872682}
vietqr.account-name=${VIETQR_ACCOUNT_NAME:PHAM ANH DUC}

# Timezone Configuration (Vietnam GMT+7)
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Webhook API Key for Auto Payment Confirmation
webhook.api-key=${WEBHOOK_API_KEY:smashflow_secret_webhook_key_2026}

# Telegram Notification Bot Configuration (Instant Alerts)
telegram.enabled=${TELEGRAM_ENABLED:true}
telegram.bot-token=${TELEGRAM_BOT_TOKEN:8664493359:AAEIrvA-XuX3aoclYOOh5bAyvMdDOLDu7UE}
telegram.chat-id=${TELEGRAM_CHAT_ID:8723745423}

